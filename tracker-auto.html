<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><title>TRACKER V2 Auto</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:Arial}#map{height:85vh}header{padding:12px;background:#0f172a;color:#fff;display:flex;gap:10px;align-items:center}select{padding:6px}</style>
</head><body>
<header>
<b>📍 TRACKER V2 AUTO</b>
<select id="userSel"><option value="all">All Users</option></select>
<span id="count">Loading...</span>
<input type="file" id="fileInput" style="display:none">
<button onclick="document.getElementById('fileInput').click()" style="margin-left:auto">📁 Choose JSON</button>
</header>
<div id="map"></div>
<script>
var map=L.map('map').setView([13.0827,80.2707],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© CARTO © OSM',subdomains:'abcd'}).addTo(map);
var layer=L.layerGroup().addTo(map);
async function processData(data){
  let users=[...new Set(data.map(d=>d.userId||'Unknown'))];
  let sel=document.getElementById('userSel');
  sel.innerHTML='<option value="all">All ('+data.length+')</option>';
  users.forEach(u=>{let o=document.createElement('option');o.value=u;o.text=u;sel.appendChild(o);});
  function draw(){
    let f=sel.value; let filtered=f=='all'?data:data.filter(d=>d.userId==f);
    document.getElementById('count').innerText=filtered.length+' points | '+f;
    layer.clearLayers(); if(!filtered.length) return;
    let latlngs=filtered.map(d=>[d.lat,d.lng]);
    L.polyline(latlngs,{color:'red',weight:4}).addTo(layer);
    latlngs.forEach(p=>L.circleMarker(p,{radius:7,fillColor:'blue',color:'#fff',weight:2,fillOpacity:1}).addTo(layer));
    map.fitBounds(latlngs,{padding:[20,20]});
  }
  sel.onchange=draw; draw();
}
// 1. Try auto-load from same folder
fetch('location_history.json').then(r=>r.text()).then(t=>{
  let data=[]; try{let j=JSON.parse(t); data=Array.isArray(j)?j:[j];}catch{data=t.trim().split('\n').map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);}
  if(data.length>0){processData(data); return;}
  throw 'empty';
}).catch(e=>{
  document.getElementById('count').innerText='Click 📁 Choose JSON -> select location_history.json';
});
// 2. Manual load
document.getElementById('fileInput').addEventListener('change',e=>{
  let fr=new FileReader();
  fr.onload=ev=>{
    let t=ev.target.result; let data=[]; try{let j=JSON.parse(t); data=Array.isArray(j)?j:[j];}catch{data=t.trim().split('\n').map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);}
    processData(data);
  };
  fr.readAsText(e.target.files[0]);
});
</script>
</body></html>
